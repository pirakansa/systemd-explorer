[package]
name = "systemd-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only systemd snapshots and an offline dependency explorer"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
