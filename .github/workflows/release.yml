name: Release

on:
  workflow_dispatch:

# Only the publication job receives write access.
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Read manifest version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo 'Run this workflow from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Cargo.toml through Cargo metadata
        id: metadata
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/release-metadata.json"
          node .github/scripts/release-metadata.cjs "$RUNNER_TEMP/release-metadata.json" Cargo.toml
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [[ -n "$existing" ]]; then
            echo "Tag $TAG already exists. Bump Cargo.toml before a new release." >&2
            exit 1
          fi

  validate:
    name: Quality gates
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build on the native architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/systemd-explorer" --help
      - name: Package collector and offline viewer
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          bundle="systemd-explorer-$TAG-linux-$ARCH"
          stage="$RUNNER_TEMP/$bundle"
          mkdir -p "$stage/viewer" dist
          cp "target/$TARGET/release/systemd-explorer" README.md LICENSE "$stage/"
          cp -R docs "$stage/docs"
          cp viewer/index.html viewer/style.css viewer/core.js viewer/timeline-core.js viewer/timeline.js viewer/context.js viewer/app.js "$stage/viewer/"
          cp -R viewer/samples "$stage/viewer/samples"
          tar -C "$RUNNER_TEMP" -czf "dist/$bundle.tar.gz" "$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true
      - name: Check assets and create checksums
        working-directory: assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -s "systemd-explorer-$TAG-linux-amd64.tar.gz"
          test -s "systemd-explorer-$TAG-linux-arm64.tar.gz"
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create tag, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The API fails if the ref exists; it never moves an existing tag.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null
          args=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" assets/*.tar.gz assets/SHA256SUMS "${args[@]}"
          gh release edit "$TAG" --draft=false --verify-tag
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
